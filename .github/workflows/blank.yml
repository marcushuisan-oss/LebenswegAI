
name: Gerar APK LebenswegAI

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: LebenswegAI

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configurar Android SDK
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Compilar aplicativo
        run: gradle assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: LebenswegAI-APK
          path: LebenswegAI/app/build/outputs/apk/debug/app-debug.apk
